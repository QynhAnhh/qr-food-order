version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: qr_order_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: qr_order_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_db:
    image: redis:alpine
    container_name: qr_order_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: